# PASSO 1 — A4-auto-CLEAN: substitui o A4-auto (g4_lora_loc) do ablation.
# Idêntico ao g4_lora_loc, mudando APENAS os dados: localização automática com
#   - SEM caixas em imagens reais  (--skip-real-boxes)
#   - SEM regiões injetadas pela pergunta (--no-ground-question)
# Assim, a comparação A4-auto (antigo) vs A4-auto-clean isola o efeito de limpar
# a supervisão (o protocolo que "deveríamos ter usado desde o início").
seed: 42
backbone: "tinyllava"
tinyllama_model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
siglip_model: "google/siglip-so400m-patch14-384"
dinov2_model: "facebook/dinov2-large"
tinyllava_weights: "outputs/tinyllava_weights.pt"
load_tinyllava_weights: true
use_dino: true
mof_strategy: "interleave"
vision_select_layer: -2
connector_hidden_dim: 2048
image_size: 384

# Warm-start IGUAL ao A4-auto original (do A3/g3_lora) — só os dados mudam.
adapter_checkpoint: "outputs/ablation/g3_lora/stage2/checkpoint-final.pt"
lora_checkpoint: "outputs/ablation/g3_lora/stage2/checkpoint-final.pt"
dino_lora_checkpoint: "outputs/dino_lora_classifier/best.pt"

train_metadata: "/datasets/deepfake/ddvqa_prepared/clean/train_loc_clean.jsonl"
val_metadata: "/datasets/deepfake/ddvqa_prepared/clean/val_loc_clean.jsonl"
test_metadata: "/datasets/deepfake/ddvqa_prepared/clean/test_loc_clean.jsonl"
image_root: "/datasets/deepfake/ddvqa_prepared/frames"
max_text_length: 384

lora_rank: 32
lora_alpha: 64
lora_target_modules: ["q_proj", "v_proj"]
lora_dropout: 0.05

max_epochs: 5
batch_size: 16
gradient_accumulation_steps: 4
num_workers: 2
balanced_sampling: true
first_token_loss_weight: 1.0
augmentation: true

train_connector: true
connector_lr: 5.0e-6
adapter_lr: 2.0e-5
lora_lr: 2.0e-5
warmup_ratio: 0.03
max_grad_norm: 1.0
mixed_precision: "bf16"
gradient_checkpointing: true

log_interval: 20
save_interval: 200
val_interval: 100
sample_interval: 100
output_dir: "outputs/ablation/g4_auto_clean/stage3"
